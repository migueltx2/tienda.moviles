<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de administración</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-blue-100 text-slate-800">
    <main class="flex min-h-screen items-center justify-center px-5 py-12">
        <section class="w-full max-w-md rounded-3xl border border-white bg-white/90 p-8 shadow-xl shadow-sky-900/10 sm:p-10">
            <div class="mx-auto mb-6 flex h-14 w-14 items-center justify-center rounded-2xl bg-sky-100 text-sky-600">
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    <path d="M12 14v3"></path>
                </svg>
            </div>

            <div class="text-center">
                <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-sky-600">Tienda de móviles</p>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">Acceso de administración</h1>
                <p class="mt-3 text-sm leading-6 text-slate-500">
                    Introduce la contraseña para acceder al panel de administración.
                </p>
            </div>

            <form action="admin/gestionarMoviles" class="mt-8 space-y-5">
                <div>
                    <label for="admin-password" class="mb-2 block text-sm font-medium text-slate-700">Contraseña</label>
                    <input id="admin-password" type="password" name="pass-login-admin" autocomplete="current-password"
                           class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-100"
                           placeholder="Escribe tu contraseña">
                </div>
                <button type="submit"
                        class="flex w-full items-center justify-center rounded-xl bg-sky-600 px-4 py-3 font-semibold text-white shadow-sm transition hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-200">
                    Entrar al panel
                </button>
            </form>
        </section>
    </main>
</body>
</html>
