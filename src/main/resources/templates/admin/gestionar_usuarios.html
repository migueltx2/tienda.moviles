<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-sky-50">
    <div th:insert="fragments/general.html :: menu"></div>

    <main class="px-4 py-6 xl:px-12">
        <div class="mb-6 flex flex-col items-center justify-between gap-4 sm:flex-row">
            <h1 class="text-3xl font-semibold text-slate-900">Gestion de usuarios</h1>
            <a href="registrarUsuario"
               class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white transition hover:bg-sky-700">Registrar usuario</a>
        </div>

        <div class="overflow-x-auto rounded-lg border border-slate-200 bg-white shadow-sm">
            <table class="w-full text-left text-sm text-slate-700">
                <thead class="bg-slate-100 text-xs uppercase text-slate-600">
                    <tr>
                        <th class="px-5 py-3">Nombre</th>
                        <th class="px-5 py-3">Apellidos</th>
                        <th class="px-5 py-3">Email</th>
                        <th class="px-5 py-3">Telefono</th>
                        <th class="px-5 py-3">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}" class="border-t border-slate-100">
                        <td class="px-5 py-4 font-medium" th:text="${u.nombre}"></td>
                        <td class="px-5 py-4" th:text="${u.apellidos}"></td>
                        <td class="px-5 py-4" th:text="${u.email}"></td>
                        <td class="px-5 py-4" th:text="${u.telefono}"></td>
                        <td class="flex gap-2 px-5 py-4">
                            <a th:href="@{${'editarUsuario?id=' + u.id}}"
                               class="rounded-md bg-sky-50 px-3 py-2 font-semibold text-sky-700 hover:bg-sky-100">Editar</a>
                            <a th:href="@{${'borrarUsuario?id=' + u.id}}"
                               onclick="return confirm('¿Estas seguro de borrar este usuario?')"
                               class="rounded-md bg-slate-100 px-3 py-2 font-semibold text-slate-600 hover:bg-red-50 hover:text-red-600">Borrar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5" class="px-5 py-8 text-center text-slate-500">Todavia no hay usuarios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
