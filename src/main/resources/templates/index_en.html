<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Online Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">
    <!-- Navigation bar -->

    <!-- Desktop menu -->
    <div class="relative flex flex-wrap items-center bg-white gap-5 p-3 justify-between border-b border-slate-200 text-slate-600 shrink-0">

        <!-- First section of the navigation bar -->
        <div class="flex gap-5">
            <a href="#" id="inicio"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">HOME</a>
            <a href="#" id="moviles"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">PHONES</a>
            <a href="admin/inicioAdmin" id="panel_admin"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">ADMIN</a>
        </div>

        <div class="order-last flex basis-full justify-center xl:absolute xl:left-1/2 xl:top-1/2 xl:order-none xl:w-auto xl:-translate-x-1/2 xl:-translate-y-1/2">
            <div id="usuarioActual"
                class="inline-flex max-w-[calc(100vw-2rem)] items-center overflow-hidden text-ellipsis whitespace-nowrap rounded-full border border-sky-200 bg-gradient-to-r from-sky-50 to-white px-4 py-2 text-sm font-semibold text-sky-800 shadow-md shadow-sky-100 transition duration-200 hover:shadow-lg hover:shadow-sky-200/70 before:mr-2 before:size-2 before:shrink-0 before:rounded-full before:bg-sky-500 before:content-[''] before:ring-4 before:ring-sky-100 xl:max-w-[35vw]">
                No user is signed in
            </div>
        </div>

        <!-- Second section of the navigation bar -->
        <div class="hidden xl:flex gap-5">
            <a href="#" id="registrarme"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">SIGN UP</a>
            <a href="#" id="identificarme"
                class="px-4 py-2 rounded-lg bg-sky-500 text-white font-medium hover:bg-sky-600 shadow-sm hover:shadow-md transition duration-200">SIGN IN</a>
            <a href="#" id="carrito"
                class="px-4 py-2 rounded-lg bg-sky-100 text-sky-600 font-medium hover:bg-sky-200 transition duration-200 hidden">CART</a>
            <a href="#" id="pedidos"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105 hidden">ORDERS</a>
            <a href="#" id="datos"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105 hidden">MY
                DETAILS</a>
            <a href="#" id="cerrar_sesion" class="px-4 py-2 rounded-lg
       bg-slate-100 text-slate-600
       hover:bg-red-100 hover:text-red-500
       transition duration-200 hidden">LOG OUT</a>
            <div class="flex items-center gap-1 rounded-xl bg-slate-100 p-1" aria-label="Select language">
                <a href="?idioma=es"
                    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-white hover:text-sky-600 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-400">Español</a>
                <a href="?idioma=en"
                    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-white hover:text-sky-600 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-400">English</a>
                <a href="?idioma=fr"
                    class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-white hover:text-sky-600 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-400">Français</a>
            </div>
        </div>

        <!-- Mobile button -->
        <button class="xl:hidden hover:cursor-pointer" id="botonMenu">
            ☰
        </button>

        <!-- Mobile menu -->
        <div class="hidden xl:hidden flex flex-col bg-white p-5 rounded-bl-lg right-0 top-16 absolute gap-5 shadow-lg" id="menuMovil">
            <a href="#" id="registrarmeMovil"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">SIGN UP</a>
            <a href="#" id="identificarmeMovil"
                class="px-4 py-2 rounded-lg bg-sky-500 text-white font-medium hover:bg-sky-600 shadow-sm hover:shadow-md transition duration-200">SIGN IN</a>
            <a href="#" id="carritoMovil"
                class="px-4 py-2 rounded-lg bg-sky-100 text-sky-600 font-medium hover:bg-sky-200 transition duration-200">CART</a>
            <a href="#" id="pedidosMovil"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">ORDERS</a>
            <a href="#" id="datosMovil"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">MY
                DETAILS</a>
            <a href="#" id="cerrar_sesionMovil" class="px-4 py-2 rounded-lg
       bg-slate-100 text-slate-600
       hover:bg-red-100 hover:text-red-500
       transition duration-200">LOG OUT</a>
            <div class="flex items-center gap-1 rounded-xl bg-slate-100 p-1" aria-label="Select language">
                <a href="?idioma=es"
                    class="flex-1 rounded-lg px-3 py-2 text-center text-sm font-medium text-slate-600 transition hover:bg-white hover:text-sky-600 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-400">Español</a>
                <a href="?idioma=en"
                    class="flex-1 rounded-lg px-3 py-2 text-center text-sm font-medium text-slate-600 transition hover:bg-white hover:text-sky-600 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-400">English</a>
                <a href="?idioma=fr"
                    class="flex-1 rounded-lg px-3 py-2 text-center text-sm font-medium text-slate-600 transition hover:bg-white hover:text-sky-600 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-400">Français</a>
            </div>
        </div>

    </div>


    <div id="contenedor">

    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.js"
            integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="librerias_js/mustache.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.8/dist/js.cookie.min.js"></script>
    <script>codigo_idioma = "en"</script>
    <script src="javascript/aplicacion.js"></script>

</body>

</html>
