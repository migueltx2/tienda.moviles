<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tienda Online</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col">
    <!-- Nav-var -->

    <!-- Menu Escritorio -->
    <div class="flex bg-white gap-5 p-3 justify-between border-b border-slate-200 text-slate-600 shrink-0">

        <!-- Primer parte nav var -->
        <div class="flex gap-5">
            <a href="#" id="inicio"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">INICIO</a>
            <a href="#" id="moviles"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">MOVILES</a>
            <a href="admin/inicioAdmin" id="panel_admin"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">ADMIN</a>
        </div>

        <!-- Segunda parte nav var -->
        <div class="hidden xl:flex gap-5">
            <a href="#" id="registrarme"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">REGISTRARME</a>
            <a href="#" id="identificarme"
                class="px-4 py-2 rounded-lg bg-sky-500 text-white font-medium hover:bg-sky-600 shadow-sm hover:shadow-md transition duration-200">IDENTIFICARME</a>
            <a href="#" id="carrito"
                class="px-4 py-2 rounded-lg bg-sky-100 text-sky-600 font-medium hover:bg-sky-200 transition duration-200">CARRITO</a>
            <a href="#" id="pedidos"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">PEDIDOS</a>
            <a href="#" id="datos"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">MIS
                DATOS</a>
            <a href="#" id="cerrar_sesion" class="px-4 py-2 rounded-lg
       bg-slate-100 text-slate-600
       hover:bg-red-100 hover:text-red-500
       transition duration-200">CERRAR SESION</a>
        </div>

        <!-- Botón móvil -->
        <button class="xl:hidden hover:cursor-pointer" id="botonMenu">
            ☰
        </button>

        <!-- Menu movil -->
        <div class="hidden xl:hidden flex flex-col bg-white p-5 rounded-bl-lg right-0 top-16 absolute gap-5 shadow-lg" id="menuMovil">
            <a href="#" id="registrarme"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">REGISTRARME</a>
            <a href="#" id="identificarme"
                class="px-4 py-2 rounded-lg bg-sky-500 text-white font-medium hover:bg-sky-600 shadow-sm hover:shadow-md transition duration-200">IDENTIFICARME</a>
            <a href="#" id="carrito"
                class="px-4 py-2 rounded-lg bg-sky-100 text-sky-600 font-medium hover:bg-sky-200 transition duration-200">CARRITO</a>
            <a href="#" id="pedidos"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">PEDIDOS</a>
            <a href="#" id="datos"
                class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-sky-100 hover:text-sky-600 transition duration-200 hover:scale-105">MIS
                DATOS</a>
            <a href="#" id="cerrar_sesion" class="px-4 py-2 rounded-lg
       bg-slate-100 text-slate-600
       hover:bg-red-100 hover:text-red-500
       transition duration-200">CERRAR SESION</a>
        </div>

    </div>




    <div id="contenedor">

    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="librerias_js/mustache.js"></script>

    <script>

        // Parte de descarga de plantillas html

        //plantilla_inicio = $.get("plantillas_html/inicio.html")
        $.get("plantillas_html/inicio.html").done(function (res) {
            plantilla_inicio = res
        })
        $.get("plantillas_html/listado_productos.html").done(function (res) {
            plantilla_productos = res
        })
        $.get("plantillas_html/detalles_producto.html").done(function (res) {
            plantilla_detalles_producto = res
        })


        // Parte de atencion a enlaces

        $("#inicio").click(
            function () {
                $("#contenedor").removeClass("grid grid-cols-5 flex-1 flex items-center justify-center")
                $("#contenedor").html(plantilla_inicio)
            }
        )

        function mostrarMoviles() {
            //Primero pedimos el json de moviles
            $.getJSON("restMoviles/listar").done(
                function (json) {
                    console.log(json)
                    //vamos a usar el json para listar los productos
                    resultadoMustache = Mustache.render(plantilla_productos, json)
                    $("#contenedor").removeClass("flex-1 flex items-center justify-center")
                        .addClass("grid xl:grid-cols-5 sm:grid-cols-2")
                        .html(resultadoMustache)

                }
            )
        } //end mostrarMoviles

        function mostrar_detalles(id) {
            //alert("Mostrar detalles del producto de id: " + id)
            $.getJSON("restMoviles/obtener-movil",
                {
                    id: id
                }
            ).done(
                function (json) {
                    console.log(json)
                    //alert("json recibido, vamos a usar una plantilla de plantillas_html para mostrarlo")
                    resultadoHtml = Mustache.render(plantilla_detalles_producto, json)
                    $("#contenedor").removeClass("grid grid-cols-5")
                        .addClass("flex-1 flex items-center justify-center")
                        .html(resultadoHtml)
                }
            )//end done
        }

        $("#moviles").click(
            mostrarMoviles
        )

        //Por defecto cuando se acceda a la web te muestre los productos
        mostrarMoviles()

        $("#registrarme").click(
            function () {
                alert("registrarme")
            }
        )
        $("#identificarme").click(
            function () {
                alert("inicio de sesion")
            }
        )
        $("#carrito").click(
            function () {
                alert("carrito")
            }
        )
        $("#pedidos").click(
            function () {
                alert("pedidos")
            }
        )
        $("#datos").click(
            function () {
                alert("datos del usuario")
            }
        )
        $("#cerrar_sesion").click(
            function () {
                alert("cierre de sesion")
            }
        )
    </script>

    <!-- Script boton movil -->
    <script>
        const botonMenu = document.getElementById("botonMenu");
        const menuMovil = document.getElementById("menuMovil");

        botonMenu.addEventListener("click", function () {

            menuMovil.classList.toggle("hidden");

        });
    </script>

</body>

</html>
