<div class="flex w-full flex-col items-center px-4 py-10 sm:py-14">
    <section class="w-full max-w-2xl rounded-2xl border border-slate-200 bg-white p-6 shadow-lg sm:p-8">
        <div class="mb-8">
            <p class="text-sm font-semibold uppercase tracking-widest text-sky-700">Passer la commande</p>
            <h1 class="mt-2 text-2xl font-bold text-slate-900 sm:text-3xl">Informations de paiement</h1>
            <p class="mt-2 text-slate-500">Saisissez les informations de votre carte pour finaliser la commande.</p>
        </div>

        <ol class="mb-8 grid grid-cols-3 gap-2" aria-label="Étapes de la commande">
            <li class="flex items-center gap-2 text-sm font-medium text-emerald-700">
                <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-emerald-100">✓</span>
                <span class="hidden sm:inline">Livraison</span>
            </li>
            <li aria-current="step" class="flex items-center gap-2 text-sm font-semibold text-sky-700">
                <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-sky-600 text-white">2</span>
                <span class="hidden sm:inline">Paiement</span>
            </li>
            <li class="flex items-center gap-2 text-sm text-slate-400">
                <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-slate-100">3</span>
                <span class="hidden sm:inline">Confirmation</span>
            </li>
        </ol>

        <form class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label for="tipo_tarjeta" class="text-sm font-medium text-slate-700">Type de carte</label>
                <select name="tipo_tarjeta" id="tipo_tarjeta"
                    class="h-11 rounded-lg border border-slate-300 bg-white px-3 text-slate-900 outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
                    <option value="0" selected disabled>Choisir un type</option>
                    <option value="visa">VISA</option>
                    <option value="master_card">MASTERCARD</option>
                </select>
            </div>
            <div class="flex flex-col gap-2">
                <label for="numero_tarjeta" class="text-sm font-medium text-slate-700">Numéro de carte</label>
                <input type="text" id="numero_tarjeta" name="numero_tarjeta" inputmode="numeric" autocomplete="cc-number"
                    placeholder="Numéro de carte..."
                    class="h-11 rounded-lg border border-slate-300 px-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
            </div>
            <div class="flex flex-col gap-2">
                <label for="titular_tarjeta" class="text-sm font-medium text-slate-700">Titulaire de la carte</label>
                <input type="text" id="titular_tarjeta" name="titular_tarjeta" autocomplete="cc-name" placeholder="Nom indiqué sur la carte"
                    class="h-11 rounded-lg border border-slate-300 px-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
            </div>
            <div class="flex flex-col gap-2">
                <label for="cvv_tarjeta" class="text-sm font-medium text-slate-700">CVV</label>
                <input type="text" id="cvv_tarjeta" name="cvv" inputmode="numeric" autocomplete="cc-csc"
                    maxlength="4" placeholder="Code de sécurité"
                    class="h-11 rounded-lg border border-slate-300 px-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-100">
            </div>
            <button type="button" id="aceptar_paso_2"
                class="mt-2 inline-flex h-12 items-center justify-center rounded-lg bg-sky-600 px-5 font-semibold text-white shadow-sm transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2">
                Continuer
            </button>
            <p class="text-center text-xs text-slate-500">Vos informations de paiement sont utilisées uniquement pour cet achat.</p>
        </form>
    </section>
</div>
