<!-- Syntaxe Mustache.js -->
<!-- Indique que le HTML présent ici peut être appliqué à chaque élément -->
<div class="col-span-full">
   <div class="flex flex-col gap-5 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5 lg:flex-row lg:items-end lg:justify-between">
      <div class="w-full lg:max-w-md">
         <label for="titulo_buscador" class="mb-2 block text-sm font-semibold text-slate-700">Rechercher par titre</label>
         <input type="search" id="titulo_buscador" placeholder="Nom du téléphone"
                class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-sky-400 focus:bg-white focus:ring-4 focus:ring-sky-100">
      </div>
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between lg:justify-end">
         <nav aria-label="Pagination des produits" class="flex items-center gap-2">
            <button type="button" id="enlace_anterior"
                    class="inline-flex h-10 items-center gap-2 rounded-lg border border-slate-200 px-4 text-sm font-semibold text-slate-600 transition hover:border-sky-300 hover:bg-sky-50 hover:text-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-400">
               <span aria-hidden="true">&larr;</span> Précédent
            </button>
            <button type="button" id="enlace_siguiente"
                    class="inline-flex h-10 items-center gap-2 rounded-lg border border-slate-200 px-4 text-sm font-semibold text-slate-600 transition hover:border-sky-300 hover:bg-sky-50 hover:text-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-400">
               Suivant <span aria-hidden="true">&rarr;</span>
            </button>
         </nav>
         <p class="text-sm text-slate-500 sm:text-right">
            Nombre total de résultats :
            <span id="total_resultados" aria-live="polite" class="ml-1 inline-flex min-w-8 items-center justify-center rounded-full bg-sky-50 px-2.5 py-1 font-bold text-sky-700"></span>
         </p>
      </div>
   </div>
</div>

{{#.}}
<div
        class="group relative flex h-full min-w-0 flex-col overflow-hidden rounded-3xl border border-slate-200/80 bg-white shadow-sm transition duration-300 hover:-translate-y-1 hover:border-sky-200 hover:shadow-xl hover:shadow-slate-200/70">
   <div class="relative flex aspect-[4/3] w-full items-center justify-center overflow-hidden bg-gradient-to-br from-slate-50 via-white to-sky-50 p-7 sm:p-8">
      <img alt="{{NOMBRE}}" src="mostrar_imagen?id={{ID}}"
          class="h-full w-full object-contain transition duration-500 group-hover:scale-105">
   </div>

   <div class="flex w-full flex-1 flex-col p-5 sm:p-6">
      <div class="flex flex-1 flex-col gap-3">
         <span class="line-clamp-2 min-h-14 text-base font-semibold leading-7 text-slate-800">{{NOMBRE}}</span>
         <span class="text-2xl font-bold tracking-tight text-sky-700">{{PRECIO}}€</span>
      </div>

      <a href="#" onclick="mostrar_detalles({{ID}})"
         class="mt-4 inline-flex w-fit items-center gap-1 text-sm font-semibold text-slate-500 transition hover:text-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-400">
            Voir les détails
            <span aria-hidden="true">&rarr;</span>
         </a>

      <div class="mt-5 flex items-center gap-3 border-t border-slate-100 pt-4">
         <input type="number" min="1" value="1" aria-label="Quantité de {{NOMBRE}}"
                class="cantidad h-11 w-20 rounded-xl border border-slate-200 bg-slate-50 px-3 text-center text-sm text-slate-700 outline-none transition focus:border-sky-400 focus:bg-white focus:ring-2 focus:ring-sky-100">
         <button type="button" onclick="agregarProductoCarrito({{ID}}, this)"
            class="flex-1 rounded-xl bg-gradient-to-r from-sky-600 to-cyan-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:from-sky-700 hover:to-cyan-700 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-offset-2">
            Ajouter au panier
         </button>
      </div>
   </div>
</div>

{{/.}}
