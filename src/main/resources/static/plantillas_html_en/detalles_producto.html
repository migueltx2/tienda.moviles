<!--Esto es otra plantilla-->
<div class="flex justify-center">
    <div class="flex w-full max-w-6xl flex-col items-center gap-6 rounded-lg border border-slate-200 bg-white p-8 m-4 shadow-lg sm:p-12">
        <h1 class="text-center text-3xl font-semibold text-slate-800">{{NOMBRE}}</h1>
        <img src="mostrar_imagen?id={{ID}}" alt="{{nombre}}" class="size-48 object-contain">
        <dl class="grid w-full grid-cols-1 gap-x-12 sm:grid-cols-2">
            <div class="flex justify-between gap-4 border-b border-slate-200 py-3">
                <dt class="text-slate-500">Model</dt>
                <dd class="text-right font-medium text-slate-800">{{MODELO}}</dd>
            </div>
            <div class="flex justify-between gap-4 border-b border-slate-200 py-3">
                <dt class="text-slate-500">Price</dt>
                <dd class="text-right font-semibold text-red-400">{{PRECIO}} €</dd>
            </div>
            <div class="flex justify-between gap-4 border-b border-slate-200 py-3">
                <dt class="text-slate-500">Storage</dt>
                <dd class="text-right font-medium text-slate-800">{{ALMACENAMIENTO}} GB</dd>
            </div>
            <div class="flex justify-between gap-4 border-b border-slate-200 py-3">
                <dt class="text-slate-500">RAM</dt>
                <dd class="text-right font-medium text-slate-800">{{RAM}} GB</dd>
            </div>
            <div class="flex justify-between gap-4 border-b border-slate-200 py-3">
                <dt class="text-slate-500">Weight</dt>
                <dd class="text-right font-medium text-slate-800">{{PESO}} g</dd>
            </div>
            <div class="flex justify-between gap-4 border-b border-slate-200 py-3">
                <dt class="text-slate-500">Category</dt>
                <dd class="text-right font-medium text-slate-800">{{CATEGORIA}}</dd>
            </div>
        </dl>
        <div class="flex w-full flex-col gap-4 border-t border-slate-200 pt-6 sm:flex-row sm:items-end sm:justify-between">
            <label for="cantidad-carrito" class="flex flex-col gap-2 text-sm font-medium text-slate-600">
                Quantity
                <input id="cantidad-carrito" type="number" min="1" value="1"
                    class="h-11 w-full rounded-md border border-slate-300 px-3 text-base text-slate-800 sm:w-32">
            </label>
            <button type="button"
                class="px-4 py-2 rounded-lg bg-sky-500 text-white font-medium hover:bg-sky-600 shadow-sm hover:shadow-md transition duration-200 hover:cursor-pointer">
                Add to cart
            </button>
        </div>
    </div>
</div>
