<div class="flex w-full flex-col items-center px-4 py-12">
    <section class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">
        <h1 class="mb-6 text-2xl font-semibold text-slate-900">Introduce tus datos para iniciar sesion</h1>
        <form class="flex flex-col gap-4" id="form_login">
            <div class="flex flex-col gap-1">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" class="h-10 rounded-lg border border-gray-300 px-3">
            </div>
            <div class="flex flex-col gap-1">
                <label for="pass">Contraseña</label>
                <input id="pass" name="pass" type="password" minlength="8" maxlength="100" required autocomplete="new-password" class="h-10 rounded-lg border border-gray-300 px-3">
            </div>
            <div>
                <input type="checkbox" id="recordar_pass">
                <span>Recordar mis datos</span>
            </div>
            <button type="submit" value="identificarme" class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white hover:bg-sky-700">Iniciar Sesion</button>
        </form>
    </section>
</div>
