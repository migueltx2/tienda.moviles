<div class="flex w-full flex-col items-center px-4 py-12">
    <section class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">
        <h1 class="mb-6 text-2xl font-semibold text-slate-900">Introduce tus datos para registrarte</h1>
        <form class="flex flex-col gap-4" id="form_registro_usuario">
            <div class="flex flex-col gap-1">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" class="h-10 rounded-lg border border-gray-300 px-3">
            </div>
            <div class="flex flex-col gap-1">
                <label for="apellidos">Apellidos</label>
                <input id="apellidos" name="apellidos" type="text" class="h-10 rounded-lg border border-gray-300 px-3">
            </div>
            <div class="flex flex-col gap-1">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" class="h-10 rounded-lg border border-gray-300 px-3">
            </div>
            <div class="flex flex-col gap-1">
                <label for="telefono">Telefono</label>
                <input id="telefono" name="telefono" type="tel" class="h-10 rounded-lg border border-gray-300 px-3">
            </div>
            <div class="flex flex-col gap-1">
                <label for="pass">Contraseña</label>
                <input id="pass" name="pass" type="password" minlength="8" maxlength="100" required autocomplete="new-password" class="h-10 rounded-lg border border-gray-300 px-3">
            </div>
            <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white hover:bg-sky-700">Registrar</button>
        </form>
    </section>
</div>
