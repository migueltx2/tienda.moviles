
<div class="flex flex-col gap-4">
    {{^.}}
    <p class="rounded-xl border border-slate-200 bg-white p-6 text-center font-medium text-slate-600 shadow-sm">
        El carrito está vacío.
    </p>
    {{/.}}
    {{#.}}
    <div class="flex flex-col gap-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:border-sky-200 hover:shadow-md sm:flex-row sm:items-center sm:justify-between sm:px-6">
        <div class="min-w-0 flex-1">
            <h2 class="break-words text-lg font-semibold text-slate-800 sm:text-xl">
                {{NOMBRE}}
            </h2>
        </div>

        <dl class="grid grid-cols-2 gap-3 sm:w-auto sm:min-w-64 sm:gap-6">
            <div class="rounded-lg bg-slate-50 px-4 py-3">
                <dt class="text-xs font-medium uppercase tracking-wide text-slate-500">Precio</dt>
                <dd class="mt-1 text-lg font-semibold text-sky-700">{{PRECIO}} €</dd>
            </div>
            <div class="rounded-lg bg-slate-50 px-4 py-3">
                <dt class="text-xs font-medium uppercase tracking-wide text-slate-500">Cantidad</dt>
                <dd class="mt-1 text-lg font-semibold text-slate-800">{{CANTIDAD}}</dd>
            </div>
        </dl>
        <button type="button" onclick="eliminarProductoCarrito({{MOVIL_ID}})"
            class="inline-flex items-center justify-center rounded-lg border border-red-200 px-4 py-2 text-sm font-medium text-red-600 transition hover:border-red-300 hover:bg-red-50 hover:text-red-700">
            Borrar producto
        </button>
    </div>
    {{/.}}
    <div class="flex justify-end border-t border-slate-200 pt-5">
        <button type="button" id="realizar_pedido"
            class="inline-flex items-center justify-center rounded-lg bg-sky-600 px-6 py-3 font-semibold text-white shadow-sm transition hover:bg-sky-700 hover:shadow-md">
            Realizar pedido
        </button>
    </div>
</div>
